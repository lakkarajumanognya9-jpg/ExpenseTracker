<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>Finance</h2>
    <a href="index.html">Dashboard</a>
    <a href="transactions.html" class="active">Transactions</a>
    <a href="add.html">Add Entry</a>
  </div>

  <div class="main">

    <h1>Expense Tracker</h1>

    <button class="add-btn" onclick="window.location.href='add.html'">
      + Add Entry
    </button>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Type</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>
    </table>

    <div class="bottom">
      Total Money Spent ₹<span id="totalSpent">0</span>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
